name: docker

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64/v8
      meta-images: compwright/docker-ec2-metadata
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: compwright
          password: ${{ secrets.DOCKERHUB_TOKEN }}
